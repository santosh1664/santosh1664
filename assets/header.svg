<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1a1236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name { font: 700 54px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .role { font: 500 22px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .tag  { font: 500 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #94a3b8; }
      .chip { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e2e8f0; }
      .fade { animation: in 0.9s ease-out both; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,18px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px,-14px); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      
      .edge { stroke: url(#accent); stroke-width: 1.4; stroke-opacity: 0.55; fill: none; stroke-dasharray: 4 6; animation: dash 6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -100; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="70" r="220" fill="url(#glow1)"/>
    <circle class="float2" cx="1120" cy="260" r="200" fill="url(#glow2)"/>

    <!-- agent graph motif -->
    <g transform="translate(840,60)">
      <path class="edge" d="M60 40 L180 20 L280 90 L200 170 L80 150 Z M60 40 L200 170 M180 20 L80 150 M280 90 L80 150"/>
      <circle cx="60" cy="40" r="6" fill="#60a5fa"/>
      <circle cx="180" cy="20" r="5" fill="#5eead4"/>
      <circle cx="280" cy="90" r="7" fill="#a78bfa"/>
      <circle cx="200" cy="170" r="5" fill="#60a5fa"/>
      <circle cx="80" cy="150" r="6" fill="#5eead4"/>
      <circle cx="170" cy="95" r="16" fill="none" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="170" cy="95" r="5" fill="#f8fafc"/>
    </g>

    <rect x="64" y="64" width="56" height="4" rx="2" fill="url(#accent)" class="fade d1"/>
    <text x="64" y="128" class="name fade d1">Durgasantosh G</text>
    <text x="64" y="166" class="role fade d2">Software Engineer · Full Stack + AI/ML Engineering</text>
    <text x="64" y="204" class="tag fade d3">&gt; Java · Spring Boot · Python · React · LLM agents · RAG<tspan class="cursor" fill="#5eead4">▍</tspan></text>

    <g class="fade d4" transform="translate(64,232)">
      <rect width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="59" y="20" text-anchor="middle" class="chip">Dallas, TX</text>
      <rect x="130" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="205" y="20" text-anchor="middle" class="chip">3.5 yrs exp</text>
      <rect x="292" width="200" height="30" rx="15" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.45"/>
      <text x="392" y="20" text-anchor="middle" class="chip" fill="#5eead4">Open to new roles</text>
    </g>
  </g>
</svg>
